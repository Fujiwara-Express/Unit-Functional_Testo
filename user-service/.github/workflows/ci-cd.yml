name: CI/CD Pipeline – user-service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: user-service
  # Override in repo secrets: REGISTRY, e.g. docker.io/youruser or ghcr.io/yourorg
  REGISTRY: ${{ secrets.REGISTRY || 'ghcr.io/yourorg' }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Step 2: Unit Tests  (go test)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-test:
    name: "2 · Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run unit tests with race detector
        run: go test -race -count=1 -timeout=300s ./...

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "*.out"
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 3: Lint / Vet  (go vet)
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: "3 · Lint / Vet"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 4: Build Image  (local / CI)
  # ─────────────────────────────────────────────────────────────────────────────
  build-image:
    name: "4 · Build Docker Image"
    runs-on: ubuntu-latest
    needs: [unit-test, lint]
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      full_image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Export to Docker daemon so functional tests can use it
          load: true

      - name: Save image as tar for next job
        run: |
          docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            -o /tmp/user-service.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/user-service.tar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 5: Functional Tests  (app running locally in CI)
  # ─────────────────────────────────────────────────────────────────────────────
  functional-test:
    name: "5 · Functional Tests"
    runs-on: ubuntu-latest
    needs: build-image
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: userservice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/user-service.tar

      - name: Start user-service container
        run: |
          docker run -d \
            --name user-service \
            --network host \
            -e PORT=8080 \
            -e DB_DSN="postgres://postgres:postgres@localhost:5432/userservice?sslmode=disable" \
            -e JWT_SECRET="ci-test-secret-32-chars-minimum!!" \
            -e MIGRATIONS_DIR=/app/migrations \
            ${{ needs.build-image.outputs.full_image }}

      - name: Wait for service to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health 2>/dev/null || \
               curl -sf http://localhost:8080/users/register -X POST \
                 -H "Content-Type: application/json" \
                 -d '{}' -o /dev/null -w "%{http_code}" | grep -qE "^(400|422)"; then
              echo "Service is up"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run functional tests
        run: bash scripts/functional_test.sh

      - name: Print container logs on failure
        if: failure()
        run: docker logs user-service

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 6: Push Image
  # ─────────────────────────────────────────────────────────────────────────────
  push-image:
    name: "6 · Push Image"
    runs-on: ubuntu-latest
    needs: functional-test
    # Only push on main branch or version tags
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 7: Deploy to Kubernetes
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "7 · Deploy to Kubernetes"
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta (get tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Substitute image tag in manifests
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" \
            k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n user-service \
            --timeout=180s

  # ─────────────────────────────────────────────────────────────────────────────
  # Step 8: Verify
  # ─────────────────────────────────────────────────────────────────────────────
  verify:
    name: "8 · Verify Deployment"
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Check pod status
        run: |
          kubectl get pods -n user-service -l app=user-service
          kubectl get pods -n user-service -l app=user-service \
            -o jsonpath='{.items[*].status.containerStatuses[*].ready}' \
            | grep -v false

      - name: Smoke test via kubectl port-forward
        run: |
          # Forward a local port to the service
          kubectl port-forward svc/user-service 18080:80 -n user-service &
          PF_PID=$!
          sleep 5

          # Hit the register endpoint — expect 400 (bad input) not 5xx
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:18080/users/register \
            -H "Content-Type: application/json" \
            -d '{}')

          kill $PF_PID || true

          if [ "$STATUS" = "400" ] || [ "$STATUS" = "422" ]; then
            echo "Smoke test passed (HTTP $STATUS)"
          else
            echo "Smoke test FAILED (HTTP $STATUS)"
            exit 1
          fi

      - name: Print deployment summary
        run: |
          echo "=== Deployment Summary ==="
          kubectl get deployment user-service -n user-service
          kubectl get svc user-service -n user-service
          kubectl get hpa user-service -n user-service 2>/dev/null || true
