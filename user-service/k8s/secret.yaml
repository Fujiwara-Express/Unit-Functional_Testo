  DB_DSN: cG9zdGdyZXM6Ly9wb3N0Z3Jlczpwb3N0Z3Jlc0Bwb3N0Z3Jlcy1zdmM6NTQzMi91c2Vyc2VydmljZT9zc2xtb2RlPWRpc2FibGU=
  JWT_SECRET: Y2hhbmdlLW1lLXRvLWEtMzItY2hhci1zZWNyZXQhIQ==
