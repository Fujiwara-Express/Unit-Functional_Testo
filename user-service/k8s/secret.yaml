# ──────────────────────────────────────────────────────────────────────────────
# IMPORTANT: Do NOT commit real credentials here.
# In production, populate this Secret via your CI/CD pipeline using:
#   kubectl create secret generic user-service-secret \
#     --from-literal=DB_DSN="postgres://..." \
#     --from-literal=JWT_SECRET="..." \
#     -n user-service --dry-run=client -o yaml | kubectl apply -f -
#
# The placeholder values below are base64-encoded examples only.
#   echo -n 'postgres://postgres:postgres@postgres-svc:5432/userservice?sslmode=disable' | base64
#   echo -n 'change-me-to-a-32-char-secret!!' | base64
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: user-service-secret
  namespace: user-service
  labels:
    app: user-service
type: Opaque
data:
