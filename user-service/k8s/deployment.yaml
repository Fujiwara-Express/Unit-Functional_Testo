apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: user-service
  labels:
    app: user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime rollout
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # ── Security hardening ──────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # distroless nonroot UID
        runAsGroup: 65532
        fsGroup: 65532

      containers:
        - name: user-service
          # IMAGE_PLACEHOLDER is replaced by sed in the CI/CD deploy step
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment from ConfigMap ──────────────────────────────────────
          envFrom:
            - configMapRef:
                name: user-service-config

          # ── Sensitive env vars from Secret ──────────────────────────────────
          env:
            - name: DB_DSN
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: DB_DSN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: JWT_SECRET

          # ── Health probes ───────────────────────────────────────────────────
          # The service has no dedicated /health endpoint, so we probe the
          # register endpoint: a 400 (bad input) means the app is up.
          readinessProbe:
            httpGet:
              path: /users/register
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /users/register
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # ── Resource limits ─────────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # ── Container security ──────────────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      # Graceful shutdown window
      terminationGracePeriodSeconds: 30
