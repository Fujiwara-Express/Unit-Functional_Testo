version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tracking_test
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking_secret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d tracking_test"]
      interval: 5s
      timeout: 5s
      retries: 10
