apiVersion: v1
kind: Secret
metadata:
  name: routing-service-secret
  namespace: routing
  labels:
    app: routing-service
type: Opaque
# Values are base64-encoded.
# Generate with: echo -n "your-value" | base64
# Replace these placeholders before applying to a real cluster.
stringData:
  DATABASE_URL: "postgres://postgres:postgres@postgres-service:5432/routing?sslmode=disable"
