apiVersion: apps/v1
kind: Deployment
metadata:
  name: routing-service
  namespace: routing
  labels:
    app: routing-service
    version: latest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: routing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0        # zero-downtime rolling update
  template:
    metadata:
      labels:
        app: routing-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: routing-service
          # Image tag is updated by CI via: kubectl set image ...
          image: ghcr.io/OWNER/routing-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          # ── Environment ──────────────────────────────────────────────────
          envFrom:
            - configMapRef:
                name: routing-service-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: routing-service-secret
                  key: DATABASE_URL

          # ── Health checks ────────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /routing/nodes
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /routing/nodes
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3

          # ── Resources ────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      # Pull from GHCR (private repo needs imagePullSecret)
      # imagePullSecrets:
      #   - name: ghcr-secret
